[target.x86_64-unknown-linux-gnu]
linker = "clang"
rustflags = [
    "-C", "link-arg=-fuse-ld=lld",  # LLD: linker más rápido, mejor dead-code elimination
    "-C", "target-cpu=x86-64",       # Baseline x86-64: compatible con cualquier CPU de 64 bits
    # Nota: se usa clang como linker frontend porque GCC inyecta -Wl,--as-needed
    # antes de los .rlib estáticos de ring, lo que hace que LLD descarte los
    # símbolos ring_core_* → "undefined symbol". Clang no inyecta --as-needed.
]

[target.aarch64-unknown-linux-gnu]
linker = "clang"
rustflags = [
    "-C", "link-arg=-fuse-ld=lld",
    "-C", "target-cpu=generic",
]
