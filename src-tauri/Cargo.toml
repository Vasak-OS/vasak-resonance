[package]
name = "vapp"
version = "0.1.0"
description = "A Vasak Application (template)"
authors = ["Vasak Group", "Joaquin (Pato) Decima"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "vapp_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-vicons = "2"
tauri-plugin-config-manager = "2"
gtk = "0.18"
base64 = "0.22"
rusqlite = { version = "0.32", features = ["bundled"] }
lofty = "0.21"
walkdir = "2.5"
dirs = "6"
rodio = "0.19"
color-thief = "0.2"
image = { version = "0.25", default-features = true }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
tauri-plugin-store = "2"
futures-util = "0.3"
tokio = { version = "1", features = ["net", "macros", "rt-multi-thread"] }
tokio-tungstenite = "0.24"
urlencoding = "2"
bytes = "1"
ureq = { version = "2", default-features = false, features = ["json"] }
tempfile = "3"
symphonia = { version = "0.5", default-features = false, features = ["aac", "mp3", "vorbis", "flac", "wav"] }

[target.'cfg(target_os = "linux")'.dependencies]
zbus = "4"

[profile.dev]
incremental = true # Compile your binary in smaller steps.

[profile.release]
codegen-units = 1 # Allows LLVM to perform better optimization.
lto = true # Enables link-time-optimizations.
opt-level = "s" # Prioritizes small binary size. Use `3` if you prefer speed.
panic = "abort" # Higher performance by disabling panic handlers.
strip = true # Ensures debug symbols are removed.
