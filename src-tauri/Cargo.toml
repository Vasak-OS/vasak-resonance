[package]
name = "vasak-resonance"
version = "0.8.2"
description = "A Vasak Application (template)"
authors = ["Vasak Group", "Joaquin (Pato) Decima"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "vasak_resonance_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-vicons = "2"
tauri-plugin-config-manager = "2"
tauri-plugin-i18n-vsk = "2.3.0"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-vsk-contextual-menu = "2"
base64 = "0.23"
rusqlite = { version = "0.32" }
lofty = "0.21"
walkdir = "2.5"
dirs = "7"
rodio = "0.19"
color-thief = "0.2"
image = { version = "0.25", default-features = true }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
tauri-plugin-store = "2"
futures-util = "0.3"
tokio = { version = "1", features = ["net", "macros", "rt-multi-thread", "sync"] }
tokio-tungstenite = "0.24"
urlencoding = "2"
discord-rich-presence = "1.1"
# El único md5 de acá adentro, y no es de seguridad: Last.fm firma cada llamada
# con el md5 de sus propios parámetros y es lo que la API pide. Sale de
# RustCrypto, que ya está en el árbol por `digest`.
md-5 = "0.11"
tauri-plugin-vsk-journal = "2"

[target.'cfg(target_os = "linux")'.dependencies]
zbus = "5"
# El icono de la bandeja. Habla StatusNotifierItem directo —es Rust puro sobre
# zbus, no suma ninguna biblioteca del sistema— y por eso el clic izquierdo
# llega: libappindicator lo consume para abrir el menú y `activate` no se
# dispara nunca.
ksni = "0.3"
gtk = { version = "0.18", features = ["v3_24"] }
gtk-layer-shell = { version = "0.8", features = ["v0_5"] }

[profile.dev]
incremental = true # Compile your binary in smaller steps.

[profile.release]
codegen-units = 1  # Allows LLVM to perform better optimization.
lto = "thin"       # Thin LTO: ~90% de fat LTO, compila mucho más rápido.
opt-level = 3      # Máxima optimización de velocidad.
panic = "abort"    # Higher performance by disabling panic handlers.
strip = true       # Ensures debug symbols are removed.

[dev-dependencies]
# Sólo para el test que valida los catálogos de idioma. El plugin de i18n los
# parsea en tiempo de ejecución y paniquea si no puede, así que un error de
# sintaxis no se ve hasta que la aplicación no arranca.
serde_yaml = "0.9"
tempfile = "3.27.0"

[features]
# Sin esta feature, `tauri` sirve la interfaz desde `devUrl`, así que un binario
# compilado a mano —en `debug` o en `release`— abre la ventana con «Could not
# connect to localhost» y la aplicación no se puede mirar fuera de `tauri dev`.
# Con ella la interfaz sale de `dist/`, que es lo que hace el empaquetado.
# Correr `cargo build --features custom-protocol` es la forma de ver la ventana
# de verdad, y es lo que tienen las otras quince aplicaciones.
custom-protocol = ["tauri/custom-protocol"]
